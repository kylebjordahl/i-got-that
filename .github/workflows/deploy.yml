name: Deploy (reusable)

# Reusable deployment: provision durable infra (Terraform), apply D1 migrations,
# and deploy the Worker (Wrangler) for a given environment. Called by
# deploy-staging.yml (after CI passes on main) and deploy-production.yml
# (release published).
#
# `environment` (staging | production) drives every derived value (wrangler env
# key, D1 name, TF backend). `ref` optionally pins the commit to deploy.

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment — "staging" or "production"
        required: true
        type: string
      ref:
        description: >-
          Git ref/SHA to check out and deploy. Defaults to the standard
          checkout ref. Staging passes the exact commit that passed CI so a
          later push to main can't sneak an unvalidated commit into deploy.
        required: false
        type: string
        default: ""
    outputs:
      build_name:
        description: >-
          Marketing version computed by the `version` job (see below) for
          this run — the same value embedded in the iOS/web builds. Exposed
          so deploy-staging.yml can keep a draft release's tag in sync with
          it without re-deriving the version itself.
        value: ${{ jobs.version.outputs.build_name }}
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      # Zone backing the custom domain (same zone for staging + production —
      # see docs/DEPLOYMENT.md §7/§9), needed by the zone-scoped rate-limiting
      # ruleset in infra/terraform/main.tf. Required: that resource is
      # unconditional, so every apply needs it.
      CLOUDFLARE_ZONE_ID:
        required: true
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      # iOS TestFlight signing/upload, used by the `testflight` job for both
      # environments (staging/prod each have their own profile secret below).
      # Optional so a caller that doesn't do TestFlight yet still validates.
      IOS_DIST_CERT_P12_BASE64:
        required: false
      IOS_DIST_CERT_PASSWORD:
        required: false
      IOS_STAGING_PROFILE_BASE64:
        required: false
      IOS_PROD_PROFILE_BASE64:
        required: false
      APP_STORE_CONNECT_KEY_ID:
        required: false
      APP_STORE_CONNECT_ISSUER_ID:
        required: false
      APP_STORE_CONNECT_API_KEY_P8:
        required: false
      # Google Play signing/upload, used by the `play-build` / `play-upload`
      # jobs. One upload keystore covers both environments — they're separate
      # Play apps (com.kylebjordahl.igt.staging / com.kylebjordahl.igt), but
      # nothing requires separate upload certificates, and one key is one
      # thing to not lose. Optional, same as the iOS pair above, so a caller
      # that doesn't publish to Play still validates.
      ANDROID_UPLOAD_KEYSTORE_BASE64:
        required: false
      ANDROID_UPLOAD_KEYSTORE_PASSWORD:
        required: false
      ANDROID_UPLOAD_KEY_ALIAS:
        required: false
      ANDROID_UPLOAD_KEY_PASSWORD:
        required: false
      PLAY_SERVICE_ACCOUNT_JSON:
        required: false

jobs:
  # Computed once and shared via job outputs, rather than in the `deploy` and
  # `testflight` jobs separately: those build on different runners (ubuntu vs
  # macOS) and can't share step outputs directly, but the web client and the
  # iOS app must embed the exact same marketing version for a given workflow
  # run.
  version:
    name: Determine app version
    runs-on: ubuntu-latest
    outputs:
      build_name: ${{ steps.version.outputs.build_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          # Full history + tags: derivation below needs to walk commits since
          # the last tag (staging) or find the tag on this exact commit
          # (production), neither of which a shallow clone can do.
          fetch-depth: 0

      # Marketing version (`--build-name` / CFBundleShortVersionString on
      # iOS; the `version` field of the web client's `version.json`):
      # - production always ships the exact version of the GitHub Release that
      #   triggered this deploy — that release's tag is always present on the
      #   released commit.
      # - staging deploys ahead of any release, so it guesses the *next*
      #   version by bumping the latest tag according to Conventional Commits
      #   (`feat` -> minor, `fix`/other -> patch, `!` or `BREAKING CHANGE` ->
      #   major) found since that tag. When that can't be determined
      #   semantically — no tag yet, or nothing since it is in Conventional
      #   Commits form — it falls back to plain `git describe` form: the last
      #   tag plus the commit count and short hash since it (with `0.0.0`
      #   standing in for "no tag yet").
      - name: Determine app version
        id: version
        uses: actions/github-script@v7
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        with:
          script: |
            const environment = process.env.ENVIRONMENT;

            const git = async (...args) => {
              const { stdout } = await exec.getExecOutput('git', args, { ignoreReturnCode: true });
              return stdout.trim();
            };

            const latestTag = await git('describe', '--tags', '--abbrev=0');
            let buildName;

            if (environment === 'production') {
              const tagsOnHead = (await git('tag', '--points-at', 'HEAD')).split('\n').filter(Boolean);
              const releaseTag = tagsOnHead.find((t) => /^v?\d+\.\d+\.\d+/.test(t));
              if (!releaseTag) {
                core.setFailed(`No version tag found on the released commit (${await git('rev-parse', 'HEAD')}).`);
                return;
              }
              buildName = releaseTag.replace(/^v/, '');
              core.info(`Production build name: ${buildName} (from release tag ${releaseTag})`);
            } else {
              const baseVersion = latestTag.replace(/^v/, '') || '0.0.0';
              const logRange = latestTag ? `${latestTag}..HEAD` : 'HEAD';
              const subjects = await git('log', logRange, '--format=%s');

              let bump = '';
              if (latestTag && subjects) {
                if (/^[a-z]+(\(.+\))?!:/m.test(subjects) || /BREAKING CHANGE/.test(subjects)) {
                  bump = 'major';
                } else if (/^feat(\(.+\))?:/m.test(subjects)) {
                  bump = 'minor';
                } else if (/^fix(\(.+\))?:/m.test(subjects)) {
                  bump = 'patch';
                }
              }

              if (bump) {
                const [major, minor, patch] = baseVersion.split('.').map(Number);
                buildName = bump === 'major' ? `${major + 1}.0.0`
                  : bump === 'minor' ? `${major}.${minor + 1}.0`
                  : `${major}.${minor}.${patch + 1}`;
                core.info(`Staging build name: ${buildName} (next ${bump} version after ${latestTag})`);
              } else {
                const commitCount = await git('rev-list', logRange, '--count');
                const shortHash = await git('rev-parse', '--short', 'HEAD');
                buildName = `${baseVersion}-${commitCount}-g${shortHash}`;
                core.info(`Staging build name: ${buildName} (no semantic bump determinable since ${latestTag || 'the start of history'})`);
              }
            }

            core.setOutput('build_name', buildName);

  deploy:
    name: Deploy → ${{ inputs.environment }}
    needs: version
    runs-on: ubuntu-latest
    # Binds to the GitHub Environment — add required reviewers there to gate
    # production behind a manual approval. Backend and TestFlight each have
    # their own per-stage Environment (this one's "-backend") so a required
    # reviewer or branch policy on one doesn't block the other, and so their
    # deployment histories don't interleave.
    environment: ${{ inputs.environment }}-backend
    # Everything else is derived from `environment` (staging | production).
    env:
      WRANGLER_ENV: "${{ inputs.environment }}"
      D1_DATABASE: "igt-${{ inputs.environment == 'production' && 'prod' || 'staging' }}"
      TF_BACKEND: "backend.${{ inputs.environment }}.hcl"
    steps:
      - name: Validate environment
        run: |
          if [ "$WRANGLER_ENV" != "staging" ] && [ "$WRANGLER_ENV" != "production" ]; then
            echo "::error::environment must be 'staging' or 'production' (got '$WRANGLER_ENV')."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/pnpm-install

      # Build the Flutter web client and stage it under apps/api/public/app so
      # the Worker serves it (same origin) at /app. API base is the relative
      # /api on that origin. The built bundle is cached and keyed on the mobile
      # sources *and the environment* (APP_ENV is baked into the bundle — it
      # drives the staging-only beta ribbon — so the two envs must never share a
      # cache entry): a backend/infra-only deploy restores it and skips the
      # Flutter SDK download + web build (the slowest part of the deploy). Only
      # a change under apps/mobile busts the cache and triggers a rebuild. The
      # marketing version and build number are *not* part of the cache key —
      # see "Stamp web client version" below, which re-embeds this run's
      # values on every deploy regardless of cache hit/miss.
      - name: Restore built web client
        id: web-client-cache
        uses: actions/cache@v6
        with:
          path: apps/api/public/app
          key: >-
            web-client-${{ inputs.environment }}-${{ hashFiles('apps/mobile/lib/**',
            'apps/mobile/web/**', 'apps/mobile/pubspec.yaml', 'apps/mobile/pubspec.lock') }}
      - uses: subosito/flutter-action@v2
        if: steps.web-client-cache.outputs.cache-hit != 'true'
        with:
          channel: stable
          cache: true
      - name: Build web client
        if: steps.web-client-cache.outputs.cache-hit != 'true'
        working-directory: apps/mobile
        run: |
          flutter create . --platforms=web --project-name caretaker_app
          flutter pub get
          flutter build web --base-href /app/ --dart-define=API_BASE_URL=/api \
            --dart-define=APP_ENV=${{ inputs.environment }} \
            --build-name=${{ needs.version.outputs.build_name }} \
            --build-number=${{ github.run_number }}
      - name: Stage web assets
        if: steps.web-client-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf apps/api/public/app
          mkdir -p apps/api/public
          cp -r apps/mobile/build/web apps/api/public/app
      # Runs whether the bundle was rebuilt or restored from cache — the Worker
      # must never deploy without its web assets.
      - name: Verify web assets present
        run: |
          if [ ! -f apps/api/public/app/index.html ]; then
            echo "::error::Web assets missing: apps/api/public/app/index.html not found." \
                 "Neither the cache restore nor the Flutter build produced the web" \
                 "client — the Worker would deploy without it. Failing early."
            exit 1
          fi
          echo "Serving $(find apps/api/public/app -type f | wc -l) web asset file(s)."

      # Runs unconditionally, even on a cache hit: `flutter build web` bakes
      # the marketing version + build number into this one small JSON file
      # (fetched at runtime by package_info_plus, not compiled into the JS/wasm
      # bundle), so it's cheap to re-stamp on every deploy without forcing a
      # full rebuild — keeping the web client's displayed version identical to
      # this run's TestFlight build (`testflight` job below) even when the
      # compiled bundle itself is stale/reused.
      - name: Stamp web client version
        run: |
          cat > apps/api/public/app/version.json <<JSON
          {"app_name":"caretaker_app","package_name":"caretaker_app","version":"${{ needs.version.outputs.build_name }}","build_number":"${{ github.run_number }}"}
          JSON

      - uses: hashicorp/setup-terraform@v4
      - name: Terraform apply (${{ inputs.environment }} infra)
        working-directory: infra/terraform
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_environment: ${{ inputs.environment }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          # -input=false on both: a required var/backend-config value that
          # isn't supplied must fail fast with a clear error, never fall back
          # to an interactive prompt — this runner has no stdin, so a prompt
          # just hangs forever with no error and no timeout (see the outage
          # where a new required var, cloudflare_zone_id, wasn't yet wired
          # through TF_VAR_ here and the apply step sat for over an hour).
          terraform init -backend-config="$TF_BACKEND" -input=false
          terraform apply -auto-approve -input=false

      # Named envs don't inherit the top-level dev `vars`, so anything the code
      # needs at runtime has to exist as a per-env secret — and an absent one
      # doesn't fail the deploy, it boots fine and misbehaves later.
      #
      # Only the envelope-encryption key blocks the deploy, because it's the one
      # whose absence is *silent*: no key ⇒ every stored credential is
      # unreadable, connecting an account 503s, and feeds and mirrors just skip.
      # The rest fail closed and loudly (a 501 naming the feature), so a missing
      # one disables that feature rather than corrupting anything — worth a
      # warning, never worth blocking a deploy that fixes something else.
      - name: Verify required Worker secrets are set
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Matched as whole words against the raw listing rather than parsed:
          # `wrangler secret list` has rendered both JSON and a table across
          # versions, and a name is a name in either. `_` is word-constituent,
          # so KEK_V1 doesn't match KEK_V10 and KEK doesn't match KEK_V1.
          listing="$(pnpm wrangler secret list --env "$WRANGLER_ENV")"
          echo "$listing"
          has() { printf '%s\n' "$listing" | grep -qw "$1"; }

          # Fails closed at runtime with a 501 that names the feature.
          for optional in COOKIE_SIGNING_KEY GOOGLE_OAUTH_CLIENT_SECRET; do
            has "$optional" || echo "::warning::'$WRANGLER_ENV' has no $optional." \
              "The features that need it answer 501 until it's set:" \
              "cd apps/api && echo '<value>' | pnpm wrangler secret put" \
              "$optional --env $WRANGLER_ENV (see docs/DEPLOYMENT.md § 6)."
          done

          # Envelope encryption needs KEK_V1 *or* the pre-split KEK it falls back
          # to (lib/secrets.ts) — an env that predates versioning can't produce
          # KEK_V1, because Worker secrets can't be read back out.
          if has KEK_V1; then
            :
          elif has KEK; then
            echo "::warning::'$WRANGLER_ENV' has no KEK_V1 and is running envelope" \
                 "encryption on the legacy unversioned KEK. That works — but do NOT" \
                 "delete that secret; its value can't be recovered and it is the only" \
                 "key that decrypts credentials stored before versioning."
          else
            echo "::error::'$WRANGLER_ENV' has no envelope-encryption key — neither" \
                 "KEK_V1 nor the legacy KEK. Every stored credential would be" \
                 "unreadable and connecting an account would fail. Set one with:" \
                 "cd apps/api && echo '<value>' | pnpm wrangler secret put KEK_V1" \
                 "--env $WRANGLER_ENV (see docs/DEPLOYMENT.md § 6). Refusing to deploy."
            exit 1
          fi

      - name: Apply D1 migrations + deploy Worker
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm wrangler d1 migrations apply "$D1_DATABASE" --env "$WRANGLER_ENV" --remote
          pnpm wrangler deploy --env "$WRANGLER_ENV"

      # No post-deploy probe of the public origin: the Cloudflare edge in front
      # of both hostnames answers a plain curl with 403 (bot protection / an
      # Access policy) before the Worker ever sees it, so the probe could only
      # ever report on its own reachability. `GET /api/health` still reports
      # `config.secretsKek` for a human to check in a browser — see
      # docs/DEPLOYMENT.md § 6. The pre-deploy secret check above is the gate,
      # and it goes through the Cloudflare API rather than the public origin.

  # Building/signing/uploading in `testflight` below is the expensive part of
  # deploying to TestFlight (and the reason that job needs macOS runners), so
  # decide whether it's needed on a cheap ubuntu runner first. Nx-affected is
  # base/head aware (unlike a plain path grep) and understands the project
  # graph, so it correctly catches mobile changes spread across several
  # commits, not just the most recent one.
  check-mobile-changed:
    name: Check for mobile app changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      changed: ${{ steps.mobile-changed.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          # Full history: the last successful TestFlight build may be many
          # commits back, and Nx needs both ends of the range locally.
          fetch-depth: 0
      - uses: ./.github/actions/pnpm-install

      # Walk this environment's "Deploy <env>" runs newest-first and find the
      # most recent one where *both* store uploads actually succeeded (as
      # opposed to no-op'd — see the job-level `if` below, a no-op reports as
      # skipped, not success). That run's commit is the last point we know
      # both TestFlight and Play are up to date, so it's the right base for
      # the Nx-affected diff below. Staging and production are tracked
      # independently (each has its own "deploy-<env>.yml" caller workflow and
      # its own last successful build), since they archive/upload on very
      # different cadences.
      #
      # Requiring *both* is what makes this correct across the introduction of
      # the Play jobs: runs from before they existed have no "Play → <env>"
      # job at all, so they're never chosen as the base, and the first Android
      # build isn't skipped on the grounds that TestFlight was already current.
      # It's conservative in the same direction afterwards — one store failing
      # rebuilds both next run, which costs a build, never a missed release.
      - name: Find commit of last successful store build
        id: base-sha
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          BASE_SHA=""
          for run_id in $(gh api "repos/${REPO}/actions/workflows/deploy-${ENVIRONMENT}.yml/runs?status=completed&per_page=30" --jq '.workflow_runs[].id'); do
            jobs_json=$(gh api "repos/${REPO}/actions/runs/${run_id}/jobs" --jq '[.jobs[] | {name, conclusion}]')
            conclusion_of() {
              printf '%s' "$jobs_json" | jq -r "[.[] | select(.name | endswith(\"$1 → ${ENVIRONMENT}\"))][0].conclusion // empty"
            }
            if [ "$(conclusion_of TestFlight)" = "success" ] && [ "$(conclusion_of Play)" = "success" ]; then
              BASE_SHA=$(gh api "repos/${REPO}/actions/runs/${run_id}" --jq '.head_sha')
              break
            fi
          done
          if [ -z "$BASE_SHA" ]; then
            echo "No prior run with both store uploads successful — building unconditionally."
          else
            echo "Last run with both store uploads successful was for commit $BASE_SHA."
          fi
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Check whether mobile is Nx-affected since that build
        id: mobile-changed
        run: |
          set -euo pipefail
          BASE_SHA="${{ steps.base-sha.outputs.base_sha }}"
          if [ -z "$BASE_SHA" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HEAD_SHA="$(git rev-parse HEAD)"
          affected=$(pnpm exec nx show projects --affected --base="$BASE_SHA" --head="$HEAD_SHA" --json)
          echo "Nx-affected projects since $BASE_SHA: $affected"
          if echo "$affected" | jq -e 'index("mobile") != null' > /dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "mobile is not Nx-affected since the last successful store build — skipping."
          fi

  # Archives and signs the mobile app's flavor for this environment, ready
  # for TestFlight. Split from the actual upload (`testflight-upload` below)
  # so the slow part — Xcode/codesign/build, the reason this needs macOS —
  # runs in parallel with `deploy` instead of waiting on it. Only the upload
  # is gated on `deploy` succeeding; a broken backend must never end up
  # fronted by a new TestFlight build.
  #
  # Gated at the job level (rather than per-step) on `check-mobile-changed`
  # so a no-op shows up as skipped, not a false green success.
  testflight-build:
    name: Build TestFlight IPA (${{ inputs.environment }})
    needs: [check-mobile-changed, version]
    if: needs.check-mobile-changed.outputs.changed == 'true'
    runs-on: macos-latest
    env:
      # Flutter flavor + Apple bundle id differ per env (see apps/mobile/ios/):
      # staging -> "staging" flavor / com.kylebjordahl.igt.staging
      # production -> "prod" flavor / com.kylebjordahl.igt
      FLAVOR: ${{ inputs.environment == 'production' && 'prod' || 'staging' }}
      API_BASE_URL: ${{ inputs.environment == 'production' && 'https://igt.kylebjordahl.com/api' || 'https://staging.igt.kylebjordahl.com/api' }}
      # The Web OAuth client id (not secret — same value as GOOGLE_OAUTH_CLIENT_ID
      # in apps/api/wrangler.jsonc for this env), passed to google_sign_in as
      # serverClientId so native Sign in with Google also returns a
      # serverAuthCode, auto-connecting the user's Google Calendar the same way
      # the web redirect flow does (see docs/AUTH.md's Google section).
      GOOGLE_SERVER_CLIENT_ID: ${{ inputs.environment == 'production' && '503268168924-5ogd6crcl1p1pfpoe3kdtqbo9nqhivpj.apps.googleusercontent.com' || '503268168924-2tdfajihn62m5o051jjdjnkfjrg921o1.apps.googleusercontent.com' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # macos-latest's default Xcode still lags Apple's App Store Connect
      # SDK requirement (e.g. Xcode 16.4/iOS 18.5 SDK when Apple requires the
      # iOS 26 SDK), so upload-testflight-build fails validation with a 409
      # SDK version error even though the archive/build steps succeed. Pin to
      # the latest stable Xcode on the runner rather than a hardcoded
      # version path, which would go stale the next time the runner image
      # drops an older point release.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Regenerates the gitignored ephemeral iOS project files; the committed
      # flavor pbxproj/xcconfigs survive (same pattern ci.yml relies on).
      - name: Regenerate ephemeral iOS project files
        working-directory: apps/mobile
        run: |
          flutter create . --platforms=ios --project-name caretaker_app
          flutter pub get

      - name: Import distribution signing certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}

      - name: Install App Store provisioning profile
        env:
          PROFILE_BASE64: ${{ inputs.environment == 'production' && secrets.IOS_PROD_PROFILE_BASE64 || secrets.IOS_STAGING_PROFILE_BASE64 }}
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$PROFILE_BASE64" | base64 --decode \
            > "$PROFILE_DIR/$FLAVOR-appstore.mobileprovision"

      # Marketing version comes from the `version` job above (shared with the
      # web client build in `deploy`, so both embed the same value for this
      # run) — see its "Determine app version" step for how it's derived.
      - name: Build signed IPA (${{ inputs.environment }})
        working-directory: apps/mobile
        run: |
          flutter build ipa --flavor "$FLAVOR" \
            --export-options-plist "ios/ExportOptions-$FLAVOR.plist" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=APP_ENV="${{ inputs.environment }}" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID" \
            --build-name=${{ needs.version.outputs.build_name }} \
            --build-number=${{ github.run_number }}

      # `github.run_number` is a small monotonic int, satisfying TestFlight's
      # "strictly increasing build number" rule without a fragile round-trip
      # to query the latest existing build.

      # Resolve the glob to a concrete file ourselves: xcrun altool (invoked
      # by upload-testflight-build in testflight-upload below) doesn't do
      # shell-style glob expansion, so a literal `*.ipa` pattern fails with
      # "File does not exist at path: .../*.ipa".
      - name: Locate built IPA
        id: locate-ipa
        working-directory: apps/mobile
        run: |
          ipa_path=$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)
          if [ -z "$ipa_path" ]; then
            echo "::error::No .ipa file found in build/ios/ipa"
            exit 1
          fi
          echo "path=apps/mobile/$ipa_path" >> "$GITHUB_OUTPUT"

      # Hands the IPA off to testflight-upload, which runs on its own runner
      # (spun up only once `deploy` has also finished) rather than this one.
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa-${{ inputs.environment }}
          path: ${{ steps.locate-ipa.outputs.path }}
          retention-days: 1

  # Pushes the IPA built above to TestFlight — gated on both the build and
  # `deploy` succeeding, so a backend deploy failure can never be fronted by
  # a new TestFlight build. Its own job (rather than a step tacked onto
  # testflight-build) so that gate doesn't hold up the expensive build/sign
  # work: testflight-build starts as soon as check-mobile-changed/version are
  # ready, in parallel with deploy, and only this short upload step waits on
  # deploy. Still needs macOS — apple-actions/upload-testflight-build shells
  # out to xcrun altool, which only exists on the Apple toolchain.
  testflight-upload:
    name: TestFlight → ${{ inputs.environment }}
    needs: [testflight-build, deploy]
    runs-on: macos-latest
    # Separate per-stage Environment from `deploy`'s "-backend" one — see the
    # comment on that job. Also what check-mobile-changed's "last successful
    # TestFlight build" lookup keys off of via this job's `name:` above.
    environment: ${{ inputs.environment }}-testflight
    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: ipa-${{ inputs.environment }}
          path: ipa

      - name: Locate downloaded IPA
        id: locate-ipa
        run: |
          ipa_path=$(find ipa -maxdepth 1 -name '*.ipa' -print -quit)
          if [ -z "$ipa_path" ]; then
            echo "::error::No .ipa file found in downloaded artifact"
            exit 1
          fi
          echo "path=$ipa_path" >> "$GITHUB_OUTPUT"

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.locate-ipa.outputs.path }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}

  # The Android counterpart to testflight-build/testflight-upload, and split
  # the same way and for the same reason: the build runs in parallel with
  # `deploy`, and only the short upload waits on the backend being known-good.
  # Unlike iOS this needs no macOS runner — Gradle and bundletool are happy on
  # ubuntu — so it's the cheap half of the pair.
  play-build:
    name: Build Play AAB (${{ inputs.environment }})
    needs: [check-mobile-changed, version]
    if: needs.check-mobile-changed.outputs.changed == 'true'
    runs-on: ubuntu-latest
    env:
      # Same flavor/env derivation as testflight-build above — staging ->
      # "staging" flavor / com.kylebjordahl.igt.staging, production -> "prod"
      # flavor / com.kylebjordahl.igt. The applicationId suffix comes from the
      # flavor itself (android/app/build.gradle.kts), not from here.
      FLAVOR: ${{ inputs.environment == 'production' && 'prod' || 'staging' }}
      API_BASE_URL: ${{ inputs.environment == 'production' && 'https://igt.kylebjordahl.com/api' || 'https://staging.igt.kylebjordahl.com/api' }}
      # The Web OAuth client id for this env — the value google_sign_in passes
      # as serverClientId, and (on Android) the `aud` the Worker checks the id
      # token against. Not secret; same string as GOOGLE_OAUTH_CLIENT_ID in
      # apps/api/wrangler.jsonc. See docs/AUTH.md's "Why two audiences".
      GOOGLE_SERVER_CLIENT_ID: ${{ inputs.environment == 'production' && '503268168924-5ogd6crcl1p1pfpoe3kdtqbo9nqhivpj.apps.googleusercontent.com' || '503268168924-2tdfajihn62m5o051jjdjnkfjrg921o1.apps.googleusercontent.com' }}
      # Makes build.gradle.kts fail rather than fall back to the debug key if
      # key.properties didn't get written below. A debug-signed AAB reaching
      # Play is not a recoverable mistake on an app's first upload — that
      # certificate becomes the app's upload certificate permanently.
      IGT_REQUIRE_RELEASE_SIGNING: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # Same pins as ci.yml's `android` job: the runner image's default JDK
      # has moved between images before, so don't inherit it.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Regenerates the gitignored ephemeral Android files; the committed
      # flavor/signing config in build.gradle.kts survives (same pattern
      # ci.yml and testflight-build rely on).
      - name: Regenerate ephemeral Android project files
        working-directory: apps/mobile
        run: |
          flutter create . --platforms=android --project-name caretaker_app
          flutter pub get

      # Both the keystore and key.properties land under android/ — which is
      # what `rootProject.file(...)` in app/build.gradle.kts resolves against
      # — and both are gitignored there, so a stray `git add` can't commit
      # them even if a later step wanted to.
      - name: Write upload keystore
        working-directory: apps/mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$KEYSTORE_BASE64" ]   || missing="$missing ANDROID_UPLOAD_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing ANDROID_UPLOAD_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]         || missing="$missing ANDROID_UPLOAD_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ]      || missing="$missing ANDROID_UPLOAD_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Empty or unset secret(s):$missing." \
                 "Set all five ANDROID_*/PLAY_* secrets (docs/DEPLOYMENT.md § 11)." \
                 "Refusing to continue — this build would be signed with the debug key."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks
          # Written with printf rather than a heredoc: a heredoc terminator
          # can't be indented inside a YAML block scalar, and `<<-` only
          # strips tabs. storeFile is relative on purpose — rootProject.file()
          # resolves it against this same directory.
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            'upload-keystore.jks' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
            > key.properties

      # Marketing version + build number come from the `version` job, the same
      # values the web client and the iOS build embed for this run. Play's
      # rule is that versionCode strictly increases *per package*;
      # github.run_number is monotonic across the whole repo, so it satisfies
      # that for both packages without querying Play for the current high
      # water mark.
      - name: Build signed AAB (${{ inputs.environment }})
        working-directory: apps/mobile
        run: |
          flutter build appbundle --flavor "$FLAVOR" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=APP_ENV="${{ inputs.environment }}" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID" \
            --build-name=${{ needs.version.outputs.build_name }} \
            --build-number=${{ github.run_number }}

      # Resolve the glob ourselves rather than handing a pattern to the upload
      # action, for the same reason the IPA step does: the output filename
      # carries the flavor, and a literal wildcard that fails to expand
      # surfaces as a confusing "file not found" inside the action.
      - name: Locate built AAB
        id: locate-aab
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          aab_path=$(find "build/app/outputs/bundle/${FLAVOR}Release" -maxdepth 1 -name '*.aab' -print -quit)
          if [ -z "$aab_path" ]; then
            echo "::error::No .aab file found in build/app/outputs/bundle/${FLAVOR}Release"
            exit 1
          fi
          echo "path=apps/mobile/$aab_path" >> "$GITHUB_OUTPUT"

      # Belt and braces on the signing guard above: read the certificate that
      # actually signed the bundle and refuse to hand a debug-signed artifact
      # to the upload job. `IGT_REQUIRE_RELEASE_SIGNING` covers a *missing*
      # key.properties; this covers the case where one exists but points at
      # the debug keystore.
      - name: Verify the AAB is not debug-signed
        run: |
          set -euo pipefail
          certs=$(keytool -printcert -jarfile "${{ steps.locate-aab.outputs.path }}" 2>&1 || true)
          owner=$(printf '%s' "$certs" | grep -m1 'Owner:' || true)
          if [ -z "$owner" ]; then
            echo "::warning::Could not read the AAB's signing certificate, so this" \
                 "check proved nothing. IGT_REQUIRE_RELEASE_SIGNING is the real guard."
            exit 0
          fi
          echo "Signed by: $owner"
          if printf '%s' "$owner" | grep -q 'CN=Android Debug'; then
            echo "::error::This AAB is signed with the Android debug certificate." \
                 "Refusing to upload it to Play."
            exit 1
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: aab-${{ inputs.environment }}
          path: ${{ steps.locate-aab.outputs.path }}
          retention-days: 1

  # Pushes the AAB to that environment's Play app, on the **internal** track
  # for both staging and production. Promotion to a wider track stays a
  # deliberate click in the Play Console, the same way publishing the draft
  # GitHub Release is what actually ships production — nothing here can put a
  # build in front of real users on its own.
  #
  # Gated on `deploy` as well as the build, so a broken backend deploy can't
  # be fronted by a new tester build. Its own job (rather than a step on
  # play-build) so that gate doesn't hold up the build itself.
  play-upload:
    name: Play → ${{ inputs.environment }}
    needs: [play-build, deploy, version]
    runs-on: ubuntu-latest
    # Separate per-stage Environment from `deploy`'s "-backend" one, matching
    # the TestFlight split — see the comment on that job. Also what
    # check-mobile-changed's "last successful store build" lookup keys off of
    # via this job's `name:` above.
    environment: ${{ inputs.environment }}-play
    env:
      # The Play app this environment publishes to. These are two separate
      # Play Console entries; the package name is what binds an upload to one
      # of them, and it is permanent per entry.
      PACKAGE_NAME: ${{ inputs.environment == 'production' && 'com.kylebjordahl.igt' || 'com.kylebjordahl.igt.staging' }}
    steps:
      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: aab-${{ inputs.environment }}
          path: aab

      - name: Locate downloaded AAB
        id: locate-aab
        run: |
          set -euo pipefail
          aab_path=$(find aab -maxdepth 1 -name '*.aab' -print -quit)
          if [ -z "$aab_path" ]; then
            echo "::error::No .aab file found in downloaded artifact"
            exit 1
          fi
          echo "path=$aab_path" >> "$GITHUB_OUTPUT"

      # Note: this cannot perform an app's *first* upload — the Play Developer
      # API refuses to create a release on an app that has never had one, so
      # the very first bundle for each entry goes up by hand through the
      # console (docs/DEPLOYMENT.md § 11). Every upload after that is this.
      - name: Upload to Play (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: ${{ steps.locate-aab.outputs.path }}
          releaseName: ${{ needs.version.outputs.build_name }} (${{ github.run_number }})
          track: internal
          status: completed
